# The TFA9872 speaker path is silent when PipeWire selects S24_32LE.
# Keep format conversion in PipeWire and open the Raphael speaker PCM with
# the S16LE/48 kHz format verified against the QUAT MI2S hardware path.
monitor.alsa.rules = [
	{
		matches = [
			{
				node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
				alsa.id = "XiaomiRedmiK20P"
			}
		]
		actions = {
			update-props = {
				audio.format = "S16LE"
				audio.rate = 48000
				audio.channels = 2
				audio.position = [ "FL", "FR" ]
			}
		}
	}
]
