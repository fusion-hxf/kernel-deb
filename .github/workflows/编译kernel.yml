name: 内核编译

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本号 / Release 版本号'
        required: false
        default: '7.1'
        type: string
      kernel_repo:
        description: '内核源码仓库'
        required: false
        default: 'https://github.com/fusion-hxf/linux-raphael.git'
        type: string
      kernel_ref:
        description: '内核源码分支/标签/提交；默认 7.1（音频 bring-up 节点）'
        required: false
        default: '7.1'
        type: string
      package_target:
        description: '内核 deb 打包目标'
        required: false
        default: 'bindeb-pkg'
        type: choice
        options:
          - bindeb-pkg
          - deb-pkg
      llvm_version:
        description: 'LLVM/Clang 版本'
        required: false
        default: '22'
        type: string
      publish_release:
        description: '是否发布/更新 GitHub Release'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Release tag；留空则使用 kernel-v<kernel_version>'
        required: false
        default: ''
        type: string

jobs:
  build-kernel:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write

    env:
      BUILD_TIMESTAMP: ${{ github.run_id }}-${{ github.run_number }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: 检出 kernel-deb 仓库
        uses: actions/checkout@v5

      - name: 安装编译依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc flex bison 7zip kmod bash cpio binutils tar git wget curl dpkg patch \
            libssl-dev libelf-dev libdw-dev debhelper-compat python3 rsync dwarves ccache

          if ! command -v "clang-${{ inputs.llvm_version }}" >/dev/null 2>&1; then
            wget -qO llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh "${{ inputs.llvm_version }}"
          fi

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-kernel-${{ inputs.kernel_version }}-${{ inputs.kernel_ref }}-llvm${{ inputs.llvm_version }}-${{ hashFiles('raphael.config', 'builddeb.patch') }}
          restore-keys: |
            ${{ runner.os }}-ccache-kernel-${{ inputs.kernel_version }}-
            ${{ runner.os }}-ccache-kernel-

      - name: 配置 ccache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats || true

      - name: 编译内核 deb 包
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
          KERNEL_PACKAGE_TARGET: ${{ inputs.package_target }}
          LLVM_VERSION: ${{ inputs.llvm_version }}
          USE_LOCAL_KERNEL: '0'
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          bash raphael-kernel_build.sh "${{ inputs.kernel_version }}"

      - name: 输出 ccache 统计
        if: always()
        run: ccache --show-stats || true

      - name: 检查产物
        run: |
          set -euo pipefail
          ls -lh *.deb kernel-build-info.env kernel-build-summary.md
          for deb in *.deb; do
            printf '%s -> %s %s %s\n' \
              "$deb" \
              "$(dpkg-deb -f "$deb" Package)" \
              "$(dpkg-deb -f "$deb" Version)" \
              "$(dpkg-deb -f "$deb" Architecture)"
          done
          cat kernel-build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 准备发布元数据
        id: meta
        run: |
          set -euo pipefail
          . ./kernel-build-info.env

          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="kernel-v${{ inputs.kernel_version }}"
          fi

          {
            echo "tag=$TAG"
            echo "timestamp=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
            echo "source_commit=$KERNEL_SOURCE_COMMIT"
            echo "source_subject=$KERNEL_SOURCE_SUBJECT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# xiaomi raphael linux 内核"
            echo
            echo "- 版本: ${{ inputs.kernel_version }}"
            echo "- Release tag: $TAG"
            echo "- 构建时间: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
            echo "- 构建 ID: ${{ env.BUILD_TIMESTAMP }}"
            echo
            cat kernel-build-summary.md
          } > release-notes.md

      - name: 发布 Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "xiaomi raphael linux 内核 ${{ steps.meta.outputs.tag }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            linux-image-xiaomi-raphael.deb
            linux-headers-xiaomi-raphael.deb
            firmware-xiaomi-raphael.deb
            alsa-xiaomi-raphael.deb
            kernel-build-info.env
            kernel-build-summary.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传内核包作为工作流制品
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages-v${{ inputs.kernel_version }}
          path: |
            *.deb
            kernel-build-info.env
            kernel-build-summary.md
            release-notes.md
